resources:
  jobs:
    globalmart_pipeline:
      name: globalmart-pipeline-${bundle.target}

      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: "Asia/Kolkata"
        pause_status: PAUSED

      tasks:

        # =========================
        # BRONZE INGESTION
        # =========================

        - task_key: ingest_customers
          notebook_task:
            notebook_path: ../src/notebooks/01_ingest_customers_batch.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: ingest_products
          notebook_task:
            notebook_path: ../src/notebooks/02_ingest_products_batch.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: ingest_orders
          notebook_task:
            notebook_path: ../src/notebooks/03_autoloader_orders.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: ingest_clickstream
          notebook_task:
            notebook_path: ../src/notebooks/04_autoloader_clickstream_streaming.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: ingest_promotions_returns
          notebook_task:
            notebook_path: ../src/notebooks/05_ingest_promotions_returns.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        # =========================
        # SILVER
        # =========================

        - task_key: silver_customers
          depends_on:
            - task_key: ingest_customers
          notebook_task:
            notebook_path: ../src/notebooks/10_silver_customers.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: silver_products
          depends_on:
            - task_key: ingest_products
          notebook_task:
            notebook_path: ../src/notebooks/11_silver_products.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: silver_orders
          depends_on:
            - task_key: ingest_orders
          notebook_task:
            notebook_path: ../src/notebooks/12_silver_orders.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: silver_clickstream
          depends_on:
            - task_key: ingest_clickstream
          notebook_task:
            notebook_path: ../src/notebooks/13_silver_clickstream.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: silver_promotions_returns
          depends_on:
            - task_key: ingest_promotions_returns
          notebook_task:
            notebook_path: ../src/notebooks/15_silver_promotions_returns.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        # =========================
        # GOLD
        # =========================

        - task_key: gold_sales_summary
          depends_on:
            - task_key: silver_orders
            - task_key: silver_products
          notebook_task:
            notebook_path: ../src/notebooks/16_gold_sales_summary.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: gold_customer_360
          depends_on:
            - task_key: silver_customers
            - task_key: silver_orders
            - task_key: silver_clickstream
            - task_key: silver_promotions_returns
          notebook_task:
            notebook_path: ../src/notebooks/17_gold_customer_360.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        - task_key: gold_product_performance
          depends_on:
            - task_key: silver_orders
            - task_key: silver_products
          notebook_task:
            notebook_path: ../src/notebooks/18_gold_product_performance.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

        # =========================
        # DATA QUALITY
        # =========================

        - task_key: gold_data_quality
          depends_on:
            - task_key: gold_sales_summary
            - task_key: gold_customer_360
            - task_key: gold_product_performance
          notebook_task:
            notebook_path: ../src/notebooks/19_gold_data_quality.py
            base_parameters:
              env: ${bundle.target}
          environment_key: default

      # =========================
      # SERVERLESS ENVIRONMENT
      # =========================

      environments:
        - environment_key: default
          spec:
            client: "1"